#cloud-config
install:
    device: /dev/sda
    auto: true
    poweroff: true
    grub_options:
        extra_cmdline: selinux=0
hostname: minis-{{ trunc 4 .MachineID }}
users:
    - name: kairos
      groups:
        - admin
      ssh_authorized_keys:
        - github:HasseJohansen
k3s:
    enabled: true
    args:
        - --disable=traefik,servicelb
        - --prefer-bundled-bin
        - --data-dir=/data/k3s
kubevip:
    eip: 192.168.8.8
p2p:
    # Disabling DHT makes co-ordination to discover nodes only in the local network
    #Enabled by default
    disable_dht: true
    vpn:
        # defaults to true
        create: false
        # defaults to true
        use: false
    # network_token is the shared secret used by the nodes to co-ordinate with p2p.
    # Setting a network token implies auto.enable = true.
    # To disable, just set auto.enable = false
    network_token: ENC[AES256_GCM,data:,iv:02Fg6eo24KQ108oHw47+H/6JvOIi2YYDFQ+q7ZjEHEc=,tag:WnwlwLXXt4U0tx5Q1lHYWg==,type:str]
    # Automatic cluster deployment configuration
    auto:
        # Enables Automatic node configuration (self-coordination)
        # for role assignment
        enable: true
        # HA enables automatic HA roles assignment.
        # A master cluster init is always required,
        # Any additional master_node is configured as part of the
        # HA control plane.
        # If auto is disabled, HA has no effect.
        ha:
            # Enables HA control-plane
            enable: true
            # Number of HA additional master nodes.
            # A master node is always required for creating the cluster and is implied.
            # The setting below adds 2 additional master nodes, for a total of 3.
            master_nodes: 2
bundles:
    - targets:
        - run://hassejohansen/flux:2.4.0
flux:
    env:
        GITHUB_TOKEN: ENC[AES256_GCM,data:N3LlGKjRK/n5Mb7hrs7agurVNixXLTE0iPj0W5j8pIfAaEO2/Z8Znb3fhkrxAfCdC90XpuVeRhyVKsuqZEwztnA3PVOK0nvyJ2jPwlz4H+Qyki+kw0YxR9fhDxeN,iv:T1cpc8a/vtIfx3VDSqD2T6jYBF21snJ8fRKYlciFsRg=,tag:+5T1U/RGuD7K6yyYMX75nQ==,type:str]
    github:
        owner: HasseJohansen
        repository: fleet-infra
        path: clusters/minis
        components-extra: image-reflector-controller,image-automation-controller
        network-policy: "false"
stages:
    after-install-chroot:
        - files:
            - path: /etc/systemd/network/10-dhcp.network
              owner: 0
              group: 0
              permissions: 420
              content: |
                [Match]
                Name=enp47s0
                [Link]
                Unmanaged=yes
          commands:
            - rm -f /var/lib/dbus/machine-id
            - rm -f /etc/machine-id
            - dbus-uuidgen --ensure
            - systemd-machine-id-setup
            - sed -i '/^config_url:.*$/d' /oem/90_custom.yaml
        - name: Create data dir
          commands:
            - mkdir -p /data
        - name: Format /dev/nvme0n1
          commands:
            - mkfs.ext4 -F /dev/nvme0n1
            #        - name: Setup mdns resolving
            #commands:
            #- echo "MulticastDNS=yes" >> /etc/systemd/resolved.conf
            #- sed -i -e 's/\(DHCP=yes\)/\1\nMulticastDNS=yes/g' /etc/systemd/network/20-dhcp.network
    # Creates the data dir after reset inside the final system chroot, just in case it's not there
    after-reset-chroot:
        - !!merge <<:
            name: Create data dir
            commands:
                - mkdir -p /data
    # Creates the data dir after upgrade inside the final system chroot, just in case it's not there
    after-upgrade-chroot:
        - !!merge <<:
            name: Create data dir
            commands:
                - mkdir -p /data
    initramfs:
        # Mounts the disk under the /data dir during initramfs on each boot, with RW. Extra options can be added to the mount here
        - name: Mount /dev/nvme0n1 under /data
          commands:
            - mount -o rw /dev/nvme0n1 /data
    boot:
        # k3s data-dir is /data/k3s (NVMe); auto-deploy manifests live under it
        - name: Add flux-system namespace manifest
          files:
            - path: /data/k3s/server/manifests/flux-system.yaml
              content: |
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: flux-system
        - name: Download SOPS secret
          files:
            - path: /data/k3s/server/manifests/sops-secret.yaml
              content: |
                apiVersion: v1
                data:
                  age.agekey: <placeholder>
                kind: Secret
                type: Opaque
                metadata:
                  name: sops-age
                  namespace: flux-system
        # multipathd must never claim Longhorn iSCSI/SPDK devices (roon-config mount-blocker bug)
        - name: Write multipath blacklist
          files:
            - path: /etc/multipath.conf
              owner: 0
              group: 0
              permissions: 420
              content: |
                defaults {
                    user_friendly_names yes
                }
                blacklist {
                    property "ID_MODEL=VIRTUAL-DISK"
                    protocol "scsi:iscsi"
                    wwid "iqn.*"
                }
